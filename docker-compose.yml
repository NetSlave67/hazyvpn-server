services:
  hazyvpn-server:
    build: .
    image: hazyvpn-server:latest
    container_name: hazyvpn-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    ports:
      # Expand this range to cover every tenant's listen port (one port per
      # tenant; see instructions/architecture.md). 51820-51920 supports up
      # to 100 tenants out of the box — widen it if you need more.
      - "51820-51920:51820-51920/udp"
    volumes:
      - hazyvpn-data:/var/lib/hazyvpn-server
      - ./config.yaml:/etc/hazyvpn-server/config.yaml:ro

volumes:
  hazyvpn-data:
